name: Update shows

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

# Empêche deux exécutions de modifier main simultanément
concurrency:
  group: update-shows
  cancel-in-progress: false

jobs:
  update-shows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Save previous JSON
        run: cp shows.json /tmp/prev_shows.json

      - name: Update shows
        run: python update_shows.py

      - name: Compare JSON files
        id: compare
        run: |
          if cmp -s /tmp/prev_shows.json shows.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      - name: Commit and push changes
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add shows.json
          git commit -m "🤖 Update shows"

          # Récupère les éventuels nouveaux commits sur main
          git pull --rebase origin main

          # Pousse notre commit par-dessus la dernière version
          git push origin main
